# LucentFlow API + Worker Deployments
#
# HARD CONSTRAINT — single-writer worker:
#   - lucentflow-worker.replicas MUST remain 1
#   - strategy MUST be Recreate (never RollingUpdate with maxSurge > 0)
#   - do NOT create a ClusterIP/LoadBalancer Service for the worker
#   - apply networkpolicy.yaml so worker:8080 is not reachable from other pods
# Scaling workers will double-write sync_status (ID=1) even with WorkerLeaseCoordinator;
# lease is defense-in-depth, not a multi-writer green light. Keep replicas: 1 until failover is validated.
#
# @author ArchLucent
# @since 1.2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lucentflow-api
  labels:
    app: lucentflow
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lucentflow
      component: api
  template:
    metadata:
      labels:
        app: lucentflow
        component: api
    spec:
      containers:
        - name: lucentflow-api
          image: lucentflow/lucentflow-api:1.2.0-STABLE
          imagePullPolicy: IfNotPresent
          args: ["--spring.profiles.active=api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: lucentflow-secrets
            - configMapRef:
                name: lucentflow-config
          env:
            - name: LUCENTFLOW_RUNTIME_ENABLE_INDEXER
              value: "false"
            - name: LUCENTFLOW_RUNTIME_ENABLE_ANALYZER
              value: "false"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lucentflow-worker
  labels:
    app: lucentflow
    component: worker
  annotations:
    lucentflow.io/single-writer: "true"
    lucentflow.io/max-replicas: "1"
spec:
  # MUST stay 1. Lease is defense-in-depth, not a multi-writer green light.
  replicas: 1
  # Recreate avoids two writers during rollouts (RollingUpdate maxSurge would race on sync_status).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lucentflow
      component: worker
  template:
    metadata:
      labels:
        app: lucentflow
        component: worker
      annotations:
        lucentflow.io/single-writer: "true"
    spec:
      # Drain window: analyzer 120s pipe wait + 60s executor; keep above Spring lifecycle 180s.
      terminationGracePeriodSeconds: 180
      containers:
        - name: lucentflow-worker
          image: lucentflow/lucentflow-api:1.2.0-STABLE
          imagePullPolicy: IfNotPresent
          args: ["--spring.profiles.active=worker"]
          # Port is for kubelet probes only — no Service should select this pod.
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: lucentflow-secrets
            - configMapRef:
                name: lucentflow-config
          env:
            - name: LUCENTFLOW_RUNTIME_ENABLE_INDEXER
              value: "true"
            - name: LUCENTFLOW_RUNTIME_ENABLE_ANALYZER
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
