spring:
  main:
    allow-bean-definition-overriding: true
    keep-alive: false
  lifecycle:
    timeout-per-shutdown-phase: 100ms
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

lucentflow:
  chain:
    rpc-url: http://localhost:8545
    rpc-backup-url: http://localhost:8545
  indexer:
    scheduler-tick-ms: 86400000
  lease:
    # Unit/IT contexts use H2 without lease tables; disable lease DB heartbeat.
    enabled: false
