server:
  shutdown: graceful
  port: 8080
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:lucentflow}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 30000
      connection-timeout: 60000
      initialization-fail-timeout: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    baseline-version: 1
    fail-on-missing-locations: true
  lifecycle:
    timeout:
      startup: 60s
      shutdown: 30s
    timeout-per-shutdown-phase: 30s

lucentflow:
  chain:
    # Default Base public RPC; set LUCENTFLOW_CHAIN_RPC_URL for Alchemy / QuickNode / Infura / BlastAPI (professional tier)
    rpc-url: ${LUCENTFLOW_CHAIN_RPC_URL:https://mainnet.base.org}
    # Failover JSON-RPC when primary returns 4xx/5xx (except 429) or I/O errors (5-minute backup window via OkHttp interceptor)
    rpc-backup-url: ${LUCENTFLOW_CHAIN_RPC_BACKUP_URL:https://mainnet.base.org}
    # PROFESSIONAL tier only: sleep between 100-block checkpoint chunks (orchestrator uses max(this, 500ms)). Lower = faster, more 429 risk.
    professional-inter-batch-sleep-ms: ${LUCENTFLOW_CHAIN_PROFESSIONAL_INTER_BATCH_SLEEP_MS:2000}
  basescan:
    api-key: ${BASESCAN_API_KEY:}
    base-url: ${BASESCAN_BASE_URL:https://api-v2.basescan.org/api}
  indexer:
    start-block: ${LUCENTFLOW_INDEXER_START_BLOCK:}
  analyzer:
    batch-size: ${LUCENTFLOW_ANALYZER_BATCH_SIZE:20}
    concurrency: ${LUCENTFLOW_ANALYZER_CONCURRENCY:2}
    # Skip rug enrich and genesis deep-trace for lower-risk whales when (head - lastScanned) exceeds this.
    catch-up-lag-blocks: ${LUCENTFLOW_ANALYZER_CATCH_UP_LAG_BLOCKS:500}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  discord:
    webhook-url: ${LUCENTFLOW_DISCORD_WEBHOOK_URL:}
  webhook:
    url: ${LUCENTFLOW_WEBHOOK_URL:}
    secret-token: ${LUCENTFLOW_WEBHOOK_SECRET_TOKEN:}
    connect-timeout-ms: ${LUCENTFLOW_WEBHOOK_CONNECT_TIMEOUT_MS:5000}
    bulkhead-permits: ${LUCENTFLOW_WEBHOOK_BULKHEAD_PERMITS:50}
    bulkhead-acquire-timeout-ms: ${LUCENTFLOW_WEBHOOK_BULKHEAD_ACQUIRE_TIMEOUT_MS:10000}
  alert:
    global-risk-threshold: ${LUCENTFLOW_ALERT_GLOBAL_RISK_THRESHOLD:70}
  admin:
    api-key: ${LUCENTFLOW_ADMIN_API_KEY:}
  api:
    # 0 disables the fallback. Live enforcement uses projects.daily_request_quota (BUILDER default 2000).
    daily-request-quota: ${LUCENTFLOW_API_DAILY_REQUEST_QUOTA:2000}
    rate-limit-per-minute: ${LUCENTFLOW_API_RATE_LIMIT_PER_MINUTE:120}
    # Soft throttle for unauthenticated public whales/sync endpoints (per client IP).
    public-rate-limit-per-minute: ${LUCENTFLOW_API_PUBLIC_RATE_LIMIT_PER_MINUTE:60}
    risk-score:
      max-concurrent: ${LUCENTFLOW_API_RISK_SCORE_MAX_CONCURRENT:4}
      timeout-ms: ${LUCENTFLOW_API_RISK_SCORE_TIMEOUT_MS:8000}
      cache-ttl-ms: ${LUCENTFLOW_API_RISK_SCORE_CACHE_TTL_MS:60000}
      cache-max-size: ${LUCENTFLOW_API_RISK_SCORE_CACHE_MAX_SIZE:256}
    forensics:
      export-max-rows: ${LUCENTFLOW_API_FORENSICS_EXPORT_MAX_ROWS:10000}
  runtime:
    # Phase 4 process-split knobs (default: monolith runs both).
    enable-indexer: ${LUCENTFLOW_RUNTIME_ENABLE_INDEXER:true}
    enable-analyzer: ${LUCENTFLOW_RUNTIME_ENABLE_ANALYZER:true}
  lease:
    # TTL leader election for indexer/analyzer. Keep K8s worker replicas=1 until multi-replica is validated.
    enabled: ${LUCENTFLOW_LEASE_ENABLED:true}
    name: indexer-leader
    ttl-seconds: ${LUCENTFLOW_LEASE_TTL_SECONDS:15}
    renew-interval-seconds: ${LUCENTFLOW_LEASE_RENEW_INTERVAL_SECONDS:5}
  oracle:
    enabled: ${LUCENTFLOW_ORACLE_ENABLED:true}
    ttl-seconds: ${LUCENTFLOW_ORACLE_TTL_SECONDS:60}
  neo4j:
    # Optional Neo4j mirror (disabled by default). Topology queries use Postgres funding_edges.
    enabled: ${LUCENTFLOW_NEO4J_ENABLED:false}
    uri: ${LUCENTFLOW_NEO4J_URI:bolt://localhost:7687}
    username: ${LUCENTFLOW_NEO4J_USERNAME:neo4j}
    password: ${LUCENTFLOW_NEO4J_PASSWORD:lucentflow}

logging:
  file:
    name: logs/lucentflow.log
  logback:
    rollingpolicy:
      max-history: 7
  level:
    # Per-block [PERF] is DEBUG; set LUCENTFLOW_LOGGING_LEVEL_COM_LUCENTFLOW=DEBUG in .env for deep tracing.
    com.lucentflow: ${LUCENTFLOW_LOGGING_LEVEL_COM_LUCENTFLOW:INFO}
    okhttp3: INFO
    org.web3j: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO

# Actuator: keep HTTP 200 on /actuator/health even when a component is DOWN so upstream probes
# (e.g. synthetic monitors, legacy load balancers) still receive a JSON body and can parse details.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      status:
        order: DOWN, OUT_OF_SERVICE, WARN, UP, UNKNOWN
        http-mapping:
          DOWN: 200
          OUT_OF_SERVICE: 200
          WARN: 200

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    enabled: true
    repair-on-migrate: true
    baseline-on-migrate: true
    validate-on-migrate: false # Temporarily bypass validation to allow the repair to trigger
