# Worker profile: indexer + analyzer. REST / Admin MVC disabled; Actuator health kept for probes.
# java -jar lucentflow.jar --spring.profiles.active=worker
#
# Dual insurance against sync_status ID=1 races:
#   1. Deploy gate — K8s worker replicas MUST stay 1 (assert_single_writer.py / SingleWriterK8sGateTest)
#   2. Runtime lease — WorkerLeaseCoordinator TTL lease gates scan + analysis (lucentflow.lease.*)
# Do not scale workers until multi-replica lease failover is validated and the deploy gate is relaxed.
# See lucentflow-deployment/k8s/README.md.
lucentflow:
  runtime:
    enable-indexer: true
    enable-analyzer: true
    enable-api: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
